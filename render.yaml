services:
  - type: web
    name: atlas-workspace
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    disk:
      name: atlas-data
      mountPath: /var/lib/atlas
      sizeGB: 1
    envVars:
      - key: ATLAS_ENVIRONMENT
        value: production
      - key: ATLAS_OWNER_TOKEN
        sync: false
      - key: ATLAS_CORS_ORIGINS
        value: "[]"
      - key: ATLAS_DATA_DIR
        value: /var/lib/atlas
