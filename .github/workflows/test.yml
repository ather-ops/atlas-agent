name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  milestone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Run browser tests with the runner's Chrome
        working-directory: frontend
        run: |
          export ATLAS_CHROMIUM_PATH="$(command -v google-chrome)"
          "$ATLAS_CHROMIUM_PATH" --version
          npm run test:e2e
